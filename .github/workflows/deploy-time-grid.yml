name: Deploy Time Grid to GitHub Pages

on:
  push:
    branches: [claude/ai-projects-brainstorm-zo9321]
    paths:
      - "projects/time-grid/**"
      - ".github/workflows/deploy-time-grid.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: projects/time-grid
        run: npm ci
      - name: Build
        working-directory: projects/time-grid
        env:
          BASE_PATH: /subscription-doctor/
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/time-grid/dist
      - id: deployment
        uses: actions/deploy-pages@v4
